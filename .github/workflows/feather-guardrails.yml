name: Feather Quantizer - scope guardrails

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-file-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Feather project path boundaries
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const controlPlaneApproved = labels.includes('control-plane-approved');

            const allowedPrefixes = [
              'keyboards/feather_quantizer/',
              'docs/feather-quantizer/',
              'prompts/',
              'scripts/feather-quantizer/',
            ];

            const controlPlaneExact = new Set([
              'AGENTS.md',
            ]);

            const controlPlanePrefixes = [
              '.github/workflows/',
            ];

            // Never allowed merely by the control-plane label.
            const immutableProtectedExact = new Set([
              '.gitmodules',
            ]);

            const immutableProtectedPrefixes = [
              'keyboards/sekigon/',
              'lib/',
              'platforms/',
              'quantum/',
              'tmk_core/',
            ];

            const violations = [];
            let nonDocChangedLines = 0;

            for (const file of files) {
              const path = file.filename;
              const isImmutableProtected = immutableProtectedExact.has(path) || immutableProtectedPrefixes.some(p => path.startsWith(p));
              const isNormalAllowed = allowedPrefixes.some(p => path.startsWith(p));
              const isControlPlane = controlPlaneExact.has(path) || controlPlanePrefixes.some(p => path.startsWith(p));
              const isAllowedControlPlane = controlPlaneApproved && isControlPlane;

              if (isImmutableProtected || (!isNormalAllowed && !isAllowedControlPlane)) {
                violations.push(path);
              }

              if (!path.startsWith('docs/') && !path.startsWith('prompts/')) {
                nonDocChangedLines += file.additions + file.deletions;
              }
            }

            if (nonDocChangedLines > 1500) {
              core.setFailed(`Non-documentation diff is ${nonDocChangedLines} changed lines; hard guardrail is 1500. Split the task or obtain explicit human approval.`);
            }

            if (violations.length > 0) {
              core.setFailed(`Files outside the Feather allowlist or inside protected upstream/dependency paths:\n${violations.join('\n')}\n\nControl-plane files require the human-applied 'control-plane-approved' PR label. That label never authorizes upstream/dependency/.gitmodules changes.`);
            }

            if (controlPlaneApproved) {
              core.notice("Human control-plane approval label detected. AGENTS.md/.github/workflows changes are allowed for this PR; upstream/dependency paths remain protected.");
            }
